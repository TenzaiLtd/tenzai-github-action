name: Tenzai Test
description: >-
  Trigger an AI-powered Tenzai security test for your workflows.
branding:
  icon: shield
  # Closest marketplace-palette match to the Tenzai cyan/teal primary.
  color: blue

inputs:
  access-key:
    description: >-
      Tenzai service-account access key (tza_...) with app:read and
      scan:trigger scopes. Store it as a repository secret.
    required: true
  app-id:
    description: >-
      ID of an existing Tenzai application. Create the application in the
      Tenzai UI first (with a target URL, code source, and credentials),
      then copy its ID from the app settings page.
    required: false
  base-url:
    description: >-
      Tenzai platform base URL. Override to target a non-production environment
      (e.g. https://api.staging.tenzai.io). The corresponding app URL is
      derived automatically (api.* → app.*).
    required: false
    default: 'https://api.tenzai.io'
  dry-run:
    description: >-
      Validate configuration, authentication, and application access without
      triggering a test.
    required: false
    default: 'false'
  org-id:
    description: >-
      ID of the organization app-id belongs to. Only needed when the
      service account's tenant has more than one active organization,
      in which case the platform can't infer which one you mean and
      requests fail with a 400. Find it in the Tenzai UI's org settings.
    required: false
    default: ''
  github-token:
    description: GitHub token used to read workflow-run history and compare commits.
    required: false
    default: ${{ github.token }}
  mode:
    description: >-
      'trigger' (default) triggers a commit-diff test against app-id.
      'list' looks up your organization and its applications instead —
      use this to discover the org_id/app-id values for other inputs.
    required: false
    default: 'trigger'

runs:
  using: node24
  main: dist/index.js
